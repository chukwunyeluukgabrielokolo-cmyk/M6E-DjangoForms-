{% extends "tapasapp/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h2>Basic List</h2>
            <p>Welcome, {{ account.username }}!</p>

            <div class="mt-3">
                <a href="{% url 'manage_account' pk=account.pk %}" class="btn btn-primary">
                    Manage Account
                </a>
                <a href="{% url 'logout' %}" class="btn btn-danger">
                    Logout
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
